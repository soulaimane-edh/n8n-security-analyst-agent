name: Validate n8n workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Static checks and skill package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check workflow JSON and connection integrity
        run: python scripts/validate_workflow.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build skill ZIP
        run: python scripts/package_skill.py
